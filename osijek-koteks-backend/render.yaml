services:
  - type: web
    name: osijek-koteks-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENABLE_PUBLIC_REGISTRATION
        value: 'false'
      - key: SERVICE_AUTH_CLIENTS_JSON
        sync: false
      - key: SERVICE_AUTH_TIMESTAMP_TOLERANCE_SECONDS
        value: '300'
      - key: SERVICE_AUTH_NONCE_TTL_SECONDS
        value: '600'
      - key: DELIVERY_NOTE_TARGET_PRODUCTION_ENABLED
        sync: false
      - key: DELIVERY_NOTE_TARGET_PRODUCTION_URL
        sync: false
      - key: DELIVERY_NOTE_TARGET_PRODUCTION_CLIENT_ID
        sync: false
      - key: DELIVERY_NOTE_TARGET_PRODUCTION_SECRET
        sync: false
      - key: DELIVERY_NOTE_TARGET_STAGING_ENABLED
        sync: false
      - key: DELIVERY_NOTE_TARGET_STAGING_URL
        sync: false
      - key: DELIVERY_NOTE_TARGET_STAGING_CLIENT_ID
        sync: false
      - key: DELIVERY_NOTE_TARGET_STAGING_SECRET
        sync: false
      - key: DELIVERY_NOTE_WORKER_POLL_INTERVAL_MS
        value: '5000'
      - key: DELIVERY_NOTE_WORKER_BATCH_SIZE
        value: '25'
      - key: DELIVERY_NOTE_WORKER_RETRY_BASE_MS
        value: '5000'
      - key: DELIVERY_NOTE_WORKER_RETRY_MAX_MS
        value: '900000'
      - key: DELIVERY_NOTE_WORKER_LEASE_MS
        value: '30000'
      - key: DELIVERY_NOTE_WORKER_HTTP_TIMEOUT_MS
        value: '15000'
